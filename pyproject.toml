[project]
name = "metadataskritp"
version = "0.2.0"
description = "Skript zum Ergänzen von Metadaten ausgehend von artist & titel"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
